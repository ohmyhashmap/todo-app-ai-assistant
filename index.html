<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>To-Do List</h1>

    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="Tambah tugas baru..." required />
      <button type="submit">Tambah</button>
    </form>

    <div class="filter-group">
      <button class="filter-btn active" data-filter="all">Semua</button>
      <button class="filter-btn" data-filter="active">Aktif</button>
      <button class="filter-btn" data-filter="completed">Selesai</button>
    </div>

    <button id="clear-completed-btn" class="clear-btn" disabled>
      Hapus Semua Selesai
    </button>

    <p id="todo-counter"></p>

    <ul id="todo-list"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
